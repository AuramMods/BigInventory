buildscript {
    repositories { maven { url = 'https://maven.minecraftforge.net/' } }
    dependencies { classpath 'org.spongepowered:mixingradle:0.7.38' }
}

plugins {
    id 'java'
    id 'eclipse'
    id 'idea'
    id 'net.minecraftforge.gradle' version '6.0.54'
}

apply plugin: 'org.spongepowered.mixin'

mixin {
    add sourceSets.main, 'biginventory.refmap.json'
    config 'biginventory.mixins.json'
}

group = 'dev.auram.biginventory'
version = mod_version
base.archivesName = 'biginventory'
java.toolchain.languageVersion = JavaLanguageVersion.of(17)
def auramTestMods = providers.gradleProperty('auramTestMods').getOrElse('true').toBoolean()

configurations {
    auramClientMods {
        canBeConsumed = false
    }
}

minecraft {
    mappings channel: 'official', version: minecraft_version
    copyIdeResources = true
    runs {
        configureEach {
            property 'forge.logging.console.level', 'info'
            // The Auram jars contain mixins compiled against production mappings.
            property 'mixin.env.remapRefMap', 'true'
            property 'mixin.env.refMapRemappingFile', file('build/createSrgToMcp/output.srg').absolutePath
            mods {
                biginventory { source sourceSets.main }
            }
        }
        client {
            workingDirectory file('run')
        }
        server {
            workingDirectory file('run-server')
            args '--nogui'
        }
    }
}

repositories {
    maven {
        url = 'https://maven.theillusivec4.top/'
        content { includeGroup 'top.theillusivec4.curios' }
    }
    maven {
        url = 'https://maven.blamejared.com/'
        content { includeGroup 'vazkii.patchouli' }
    }
    flatDir {
        dirs 'dev-mods'
        content { includeGroup 'auram.local' }
    }
}

dependencies {
    minecraft "net.minecraftforge:forge:${minecraft_version}-${forge_version}"
    annotationProcessor 'org.spongepowered:mixin:0.8.5:processor'
    compileOnly fg.deobf('top.theillusivec4.curios:curios-forge:5.14.1+1.20.1:api')
    compileOnly 'vazkii.patchouli:Patchouli:1.20.1-84.1-FORGE:api'
    if (auramTestMods) {
        file('dev-mods/auram.txt').readLines().each { coordinate ->
            runtimeOnly fg.deobf("auram.local:${coordinate}")
        }
        file('dev-mods/client.txt').readLines().each { coordinate ->
            auramClientMods fg.deobf("auram.local:${coordinate}")
        }
    }
}

tasks.named('processResources') {
    inputs.property 'modVersion', project.version
    filesMatching('META-INF/mods.toml') { expand modVersion: project.version }
}

tasks.named('jar') {
    manifest.attributes 'MixinConfigs': 'biginventory.mixins.json'
    finalizedBy 'reobfJar'
}
tasks.withType(JavaCompile).configureEach { options.encoding = 'UTF-8' }

if (auramTestMods) {
    def smoothSwapping = configurations.auramClientMods.filter {
        it.name.startsWith('smoothswapping-0.9.3.2-1.20.1-forge_')
    }
    // Smooth Swapping hardcodes SRG selectors. An empty refmap activates Mixin's userdev remapper.
    def prepareSmoothSwapping = tasks.register('prepareSmoothSwapping', Zip) {
        archiveFileName = 'smoothswapping-0.9.3.2-dev.jar'
        destinationDirectory = layout.buildDirectory.dir('dev-mods')
        from { smoothSwapping.files.collect { zipTree(it) } }
        from 'dev-mods/smoothswapping-dev.refmap.json'
        filesMatching('smoothswapping-common.mixins.json') {
            filter { line -> line.replace('"required":', '"refmap": "smoothswapping-dev.refmap.json", "required":') }
        }
    }
    tasks.withType(JavaExec).matching { it.name == 'runClient' }.configureEach {
        classpath configurations.auramClientMods.minus(smoothSwapping), prepareSmoothSwapping.flatMap { it.archiveFile }
    }
}

// Allow commands such as "stop" from a terminal running the dev server.
tasks.withType(JavaExec).matching { it.name == 'runServer' }.configureEach {
    standardInput = System.in
}
